<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priyanka | Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --bg-main: #000000;
            --bg-card: #1c1c1e;
            --bg-card-hover: #2c2c2e;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent: #2997ff;
            --success: #30d158;
            --danger: #ff453a;
            --border: rgba(255, 255, 255, 0.08);
            --glow-color: rgba(41, 151, 255, 0.15);
        }

        body.light-mode {
            --bg-main: #fbfbfd;
            --bg-card: #ffffff;
            --bg-card-hover: #f5f5f7;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #0071e3;
            --border: rgba(0, 0, 0, 0.08);
            --glow-color: rgba(0, 113, 227, 0.1);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1), color 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
        }

        .focus-glow {
            position: fixed;
            top: -20vh;
            left: -20vw;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            filter: blur(80px);
            z-index: -1;
            animation: drift 20s ease-in-out infinite alternate;
            pointer-events: none;
            transition: background 0.6s ease;
        }

        @keyframes drift {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(10vw, 10vh) scale(1.1); }
        }

        #particle-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: -2;
            pointer-events: none;
            opacity: 0.6;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 52px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            z-index: 100;
            border-bottom: 1px solid var(--border);
            transition: background 0.4s ease;
        }

        body.light-mode .header { background: rgba(251, 251, 253, 0.72); }

        .header-title {
            font-weight: 600;
            font-size: 1.15rem;
            letter-spacing: -0.015em;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .theme-toggle:hover { transform: scale(1.1) rotate(15deg); }

        .container {
            width: 100%;
            max-width: 820px;
            padding: 130px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 1;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
        }

        .cursor {
            display: inline-block;
            width: 3px;
            height: 1em;
            background-color: var(--text-main);
            animation: blink 1s step-end infinite;
            vertical-align: bottom;
            margin-left: 5px;
        }

        @keyframes blink { 50% { opacity: 0; } }

        .hero h1 {
            font-size: clamp(2.8rem, 7vw, 4.2rem);
            font-weight: 800;
            letter-spacing: -0.045em;
            line-height: 1.05;
            background: linear-gradient(180deg, var(--text-main) 20%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            min-height: 1.2em;
        }

        .hero p {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .card {
            background: var(--bg-card);
            border-radius: 28px;
            padding: 32px;
            border: 1px solid var(--border);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 1; 
            transform: translateY(0);
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: skewX(-25deg);
            transition: left 0.7s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 0;
            pointer-events: none;
        }

        .card:hover::before { left: 200%; }

        .card:hover {
            background: var(--bg-card-hover);
            transform: scale(1.015) translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        body.light-mode .card:hover { box-shadow: 0 12px 30px rgba(0,0,0,0.06); }
        body.light-mode .card::before { background: linear-gradient(to right, transparent, rgba(0, 0, 0, 0.03), transparent); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            position: relative;
            z-index: 1;
        }

        .card-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: var(--text-muted);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .mono-value {
            font-family: 'Space Mono', monospace;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--text-main);
            position: relative;
            z-index: 1;
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

        .btn {
            background: rgba(128, 128, 128, 0.15);
            color: var(--text-main);
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            z-index: 1;
        }

        .btn:hover { background: rgba(128, 128, 128, 0.25); transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }

        .progress-wrapper { margin-top: 15px; position: relative; z-index: 1;}
        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .progress-bg {
            width: 100%; height: 8px;
            background: rgba(128, 128, 128, 0.15);
            border-radius: 10px; overflow: hidden;
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: var(--text-main);
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .progress-fill.blue { background: var(--accent); }
        .progress-fill.green { background: var(--success); }

        .habit-box {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(128, 128, 128, 0.06); padding: 20px; border-radius: 20px; margin-top: 12px;
            position: relative; z-index: 1;
        }
        .streak-flame { font-size: 1.6rem; margin-right: 12px; }

        .input-row { display: flex; gap: 12px; margin-top: 12px; position: relative; z-index: 1;}
        .input-row input {
            flex: 1; min-width: 0;
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid transparent;
            padding: 16px 20px;
            border-radius: 18px;
            color: var(--text-main);
            font-size: 1rem; font-weight: 500;
            letter-spacing: -0.01em;
            outline: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-row input:focus { 
            border-color: var(--accent); 
            background: transparent; 
            box-shadow: 0 0 0 4px rgba(41, 151, 255, 0.15);
        }
        .input-row button {
            background: var(--text-main); color: var(--bg-main); 
            border: none; padding: 0 24px; border-radius: 18px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            flex-shrink: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-row button:hover { opacity: 0.9; transform: scale(1.02); }
        .input-row button:active { transform: scale(0.98); }

        #bucket-list { list-style: none; margin-top: 20px; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 1;}
        #bucket-list li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: rgba(128, 128, 128, 0.04);
            border-radius: 18px; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        #bucket-list li.completed span { text-decoration: line-through; color: var(--text-muted); }
        .task-actions button { 
            background: none; border: none; cursor: pointer; font-size: 1.2rem; 
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .task-actions button:hover { transform: scale(1.2); }
        .btn-complete { color: var(--success); }
        .btn-delete { color: var(--danger); }

        .daily-quote {
            text-align: center;
            padding: 20px;
            font-size: 1.1rem;
            font-weight: 400;
            color: var(--text-muted);
            font-style: italic;
            letter-spacing: -0.01em;
            line-height: 1.5;
            animation: fadeUp 1.5s ease forwards;
        }

    </style>
</head>
<body>

    <div class="focus-glow"></div>
    <canvas id="particle-canvas"></canvas>

    <div class="header">

    <div class="container">

        <div class="card">

        <div class="card">
            <div class="card-header">

        </div>

        <div class="daily-quote" id="quote-display">
            "The best way to predict the future is to create it."
        </div>
        
    </div>

    <script>
        // FIXED: Particles Logic
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particlesArray = [];

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.3 - 0.15;
                this.speedY = Math.random() * 0.3 - 0.15;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x > canvas.width || this.x < 0) this.speedX *= -1;
                if (this.y > canvas.height || this.y < 0) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = document.body.classList.contains('light-mode') ? 'rgba(0, 113, 227, 0.2)' : 'rgba(255, 255, 255, 0.2)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particlesArray = [];
            const numberOfParticles = (canvas.width * canvas.height) / 12000;
            for (let i = 0; i < numberOfParticles; i++) {
                particlesArray.push(new Particle());
            }
        }

        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particlesArray.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }
        
        // Start particles safely
        initParticles();
        animateParticles();

        // --- TYPEWRITER EFFECT ---
        const greetingEl = document.getElementById('greeting');
        let hasTyped = false;

        function typeWriter(text) {
            greetingEl.innerHTML = '';
            let i = 0;
            const cursor = document.createElement('span');
            cursor.className = 'cursor';
            greetingEl.appendChild(cursor);

            function type() {
                if (i < text.length) {
                    cursor.insertAdjacentText('beforebegin', text.charAt(i));
                    i++;
                    setTimeout(type, 50);
                }
            }
            type();
        }

        // --- QUOTES LOGIC ---
        const quotes = [
            "The best way to predict the future is to create it.",
            "Simplicity is the ultimate sophistication.",
            "The only way to do great work is to love what you do.",
            "Believe you can and you're halfway there.",
            "What you get by achieving your goals is not as important as what you become.",
            "Your time is limited, don't waste it living someone else's life.",
            "The journey of a thousand miles begins with one step.",
            "Success is not final, failure is not fatal: it is the courage to continue that counts.",
            "Do what you can, with what you have, where you are.",
            "The mind is everything. What you think you become."
