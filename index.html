<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priyanka | Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Mono&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        :root {
            --bg-main: #000000;
            --bg-card: #1c1c1e;
            --bg-card-hover: #2c2c2e;
            --text-main: #f5f5f7;
            --text-muted: #86868b;
            --accent: #2997ff;
            --success: #30d158;
            --danger: #ff453a;
            --border: rgba(255, 255, 255, 0.08);
        }

        body.light-mode {
            --bg-main: #fbfbfd;
            --bg-card: #ffffff;
            --bg-card-hover: #f5f5f7;
            --text-main: #1d1d1f;
            --text-muted: #86868b;
            --accent: #0071e3;
            --border: rgba(0, 0, 0, 0.08);
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-x: hidden;
            transition: background-color 0.6s cubic-bezier(0.16, 1, 0.3, 1), color 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: 52px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            background: rgba(0, 0, 0, 0.72);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            z-index: 100;
            border-bottom: 1px solid var(--border);
            transition: background 0.4s ease;
        }

        body.light-mode .header { background: rgba(251, 251, 253, 0.72); }

        .header-title {
            font-weight: 600;
            font-size: 1.15rem;
            letter-spacing: -0.015em;
        }

        .theme-toggle {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.2rem;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .theme-toggle:hover { transform: scale(1.1) rotate(15deg); }

        .container {
            width: 100%;
            max-width: 820px;
            padding: 130px 20px 100px 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .hero {
            text-align: center;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        .hero h1 {
            font-size: clamp(2.8rem, 7vw, 4.2rem);
            font-weight: 800;
            letter-spacing: -0.045em;
            line-height: 1.05;
            background: linear-gradient(180deg, var(--text-main) 20%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: -0.01em;
            color: var(--text-muted);
            font-variant-numeric: tabular-nums;
        }

        .card {
            background: var(--bg-card);
            border-radius: 28px;
            padding: 32px;
            border: 1px solid var(--border);
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            opacity: 1; 
            transform: translateY(0);
            box-shadow: 0 4px 20px rgba(0,0,0,0.02);
        }

        .card:hover {
            background: var(--bg-card-hover);
            transform: scale(1.015) translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }

        body.light-mode .card:hover {
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .mono-value {
            font-family: 'Space Mono', monospace;
            font-size: clamp(1.8rem, 5vw, 2.8rem);
            font-weight: 700;
            letter-spacing: -0.04em;
            color: var(--text-main);
        }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

        .btn {
            background: rgba(128, 128, 128, 0.15);
            color: var(--text-main);
            border: none;
            padding: 8px 18px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn:hover { 
            background: rgba(128, 128, 128, 0.25);
            transform: scale(1.05);
        }

        .btn:active { transform: scale(0.95); }

        .progress-wrapper { margin-top: 15px; }
        .progress-labels {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .progress-bg {
            width: 100%; height: 8px;
            background: rgba(128, 128, 128, 0.15);
            border-radius: 10px; overflow: hidden;
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: var(--text-main);
            border-radius: 10px;
            transition: width 0.1s linear;
        }
        .progress-fill.blue { background: var(--accent); }
        .progress-fill.green { background: var(--success); }

        .habit-box {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(128, 128, 128, 0.06); padding: 20px; border-radius: 20px; margin-top: 12px;
        }
        .streak-flame { font-size: 1.6rem; margin-right: 12px; }

        .input-row { display: flex; gap: 12px; margin-top: 12px; }
        .input-row input {
            flex: 1; min-width: 0;
            background: rgba(128, 128, 128, 0.08);
            border: 1px solid transparent;
            padding: 16px 20px;
            border-radius: 18px;
            color: var(--text-main);
            font-size: 1rem; font-weight: 500;
            letter-spacing: -0.01em;
            outline: none; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-row input:focus { 
            border-color: var(--accent); 
            background: transparent; 
            box-shadow: 0 0 0 4px rgba(41, 151, 255, 0.15);
        }
        .input-row button {
            background: var(--text-main); color: var(--bg-main); 
            border: none; padding: 0 24px; border-radius: 18px;
            font-size: 1rem; font-weight: 600; cursor: pointer;
            flex-shrink: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .input-row button:hover { opacity: 0.9; transform: scale(1.02); }
        .input-row button:active { transform: scale(0.98); }

        #bucket-list { list-style: none; margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
        #bucket-list li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 16px 20px; background: rgba(128, 128, 128, 0.04);
            border-radius: 18px; animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        #bucket-list li.completed span { text-decoration: line-through; color: var(--text-muted); }
        .task-actions button { 
            background: none; border: none; cursor: pointer; font-size: 1.2rem; 
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .task-actions button:hover { transform: scale(1.2); }
        .btn-complete { color: var(--success); }
        .btn-delete { color: var(--danger); }

    </style>
</head>
<body>

    <div class="header">
        <div class="header-title">Priyanka 🐒</div>
        <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">🌙</button>
    </div>

    <div class="container">
        <div class="hero">
            <h1 id="greeting">Hello, Priyanka 🐒.</h1>
            <p id="live-clock">Loading...</p>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Current Age</div>
                    <button class="btn" onclick="toggleAgeFormat()">Switch</button>
                </div>
                <div class="mono-value" id="age-display">0</div>
            </div>
            <div class="card">
                <div class="card-header">
                    <div class="card-title">Years Remaining</div>
                </div>
                <div class="mono-value" id="remaining-display">0</div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Next Birthday</div>
            </div>
            <div class="mono-value" id="birthday-countdown">Calculating...</div>
        </div>

        <div class="card">
            <div class="progress-wrapper" style="margin-top: 0;">
                <div class="progress-labels">
                    <span>Life Progress</span>
                    <span id="life-percent">0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill blue" id="life-progress-fill"></div>
                </div>
            </div>

            <div class="progress-wrapper" style="margin-top: 28px;">
                <div class="progress-labels">
                    <span>Today's Progress</span>
                    <span id="day-percent">0%</span>
                </div>
                <div class="progress-bg">
                    <div class="progress-fill green" id="day-progress-fill"></div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Daily Habit Streak</div>
            </div>
            <div class="habit-box">
                <div>
                    <span class="streak-flame">🔥</span>
                    <strong id="streak-count">0</strong> Day Streak
                </div>
                <button class="btn" style="background: var(--success); color: #000; font-weight: 600;" onclick="logHabit()">Log Today</button>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <div class="card-title">Bucket List</div>
            </div>
            <div class="input-row">
                <input type="text" id="task-input" placeholder="Add a life goal..." maxlength="40">
                <button onclick="addTask()">Add</button>
            </div>
            <ul id="bucket-list"></ul>
        </div>
        
    </div>

    <script>
        // PRIYANKA'S EXACT BIRTH DATE & TIME: Dec 24, 2000 at 3:30 AM
        const birthDate = new Date(2000, 11, 24, 3, 30, 0); 
        
        const expectedLifespanYears = 80;
        let showSeconds = false;

        function toggleAgeFormat() {
            showSeconds = !showSeconds;
            updateDashboard();
        }

        function updateDashboard() {
            const now = new Date();
            
            // DYNAMIC GREETING WITH MONKEY EMOJI
            const hour = now.getHours();
            let greeting = "Hello, Priyanka 🐒.";
            if (hour < 12) greeting = "Good Morning, Priyanka 🐒.";
            else if (hour < 18) greeting = "Good Afternoon, Priyanka 🐒.";
            else greeting = "Good Evening, Priyanka 🐒.";
            document.getElementById('greeting').innerText = greeting;

            // CLOCK
            document.getElementById('live-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

            // AGE CALCULATIONS
            const msSinceBirth = now - birthDate;
            const yearsSinceBirth = msSinceBirth / (1000 * 60 * 60 * 24 * 365.25);
            const yearsRemaining = expectedLifespanYears - yearsSinceBirth;
            const secondsLived = Math.floor(msSinceBirth / 1000);

            if (showSeconds) {
                document.getElementById('age-display').innerText = secondsLived.toLocaleString();
            } else {
                document.getElementById('age-display').innerText = yearsSinceBirth.toFixed(8);
            }

            document.getElementById('remaining-display').innerText = yearsRemaining.toFixed(8);

            // PROGRESS BARS
            const lifePercent = (yearsSinceBirth / expectedLifespanYears) * 100;
            document.getElementById('life-progress-fill').style.width = lifePercent + "%";
            document.getElementById('life-percent').innerText = lifePercent.toFixed(2) + "%";

            const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const endOfDay = new Date(startOfDay.getTime() + 24 * 60 * 60 * 1000);
            const dayPercent = ((now - startOfDay) / (endOfDay - startOfDay)) * 100;
            document.getElementById('day-progress-fill').style.width = dayPercent + "%";
            document.getElementById('day-percent').innerText = dayPercent.toFixed(2) + "%";

            // BIRTHDAY
            let nextBirthday = new Date(now.getFullYear(), birthDate.getMonth(), birthDate.getDate(), birthDate.getHours(), birthDate.getMinutes(), 0);
            if (now > nextBirthday) nextBirthday.setFullYear(now.getFullYear() + 1);
            const diff = nextBirthday - now;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const mins = Math.floor((diff / (1000 * 60)) % 60);
            const secs = Math.floor((diff / 1000) % 60);
            document.getElementById('birthday-countdown').innerText = `${days}d ${hours}h ${mins}m ${secs}s`;
        }

        // BUCKET LIST LOGIC
        const taskInput = document.getElementById('task-input');
        const bucketList = document.getElementById('bucket-list');
        let tasks = JSON.parse(localStorage.getItem('priyankaTasks')) || [];

        function saveTasks() {
            localStorage.setItem('priyankaTasks', JSON.stringify(tasks));
            renderTasks();
        }

        function addTask() {
            const text = taskInput.value.trim();
            if (text === '') return;
            tasks.push({ id: Date.now(), text: text, completed: false });
            taskInput.value = '';
            saveTasks();
        }

        function toggleTask(id) {
            tasks = tasks.map(task => task.id === id ? { ...task, completed: !task.completed } : task);
            saveTasks();
        }

        function deleteTask(id) {
            tasks = tasks.filter(task => task.id !== id);
            saveTasks();
        }

        function renderTasks() {
            bucketList.innerHTML = '';
            tasks.forEach(task => {
                const li = document.createElement('li');
                if (task.completed) li.classList.add('completed');
                li.innerHTML = `
                    <span style="font-weight: 500;">${task.text}</span>
                    <div class="task-actions">
                        <button class="btn-complete" onclick="toggleTask(${task.id})">✔</button>
                        <button class="btn-delete" onclick="deleteTask(${task.id})">✖</button>
                    </div>
                `;
                bucketList.appendChild(li);
            });
        }
        taskInput.addEventListener('keypress', e => { if (e.key === 'Enter') addTask(); });

        // HABIT TRACKER
        let streakData = JSON.parse(localStorage.getItem('priyankaHabit')) || { streak: 0, lastDate: null };
        
        function updateStreakUI() {
            document.getElementById('streak-count').innerText = streakData.streak;
        }

        function logHabit() {
            const today = new Date().toDateString();
            if (streakData.lastDate === today) {
                alert("You already logged your habit for today! Come back tomorrow.");
                return;
            }
            
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            
            if (streakData.lastDate === yesterday.toDateString()) {
                streakData.streak++;
            } else {
                streakData.streak = 1; 
            }
            
            streakData.lastDate = today;
            localStorage.setItem('priyankaHabit', JSON.stringify(streakData));
            updateStreakUI();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-mode');
            document.getElementById('theme-btn').innerText = document.body.classList.contains('light-mode') ? '☀️' : '🌙';
        }

        renderTasks();
        updateStreakUI();
        updateDashboard();
        
        // 10ms refresh rate for ultra-fast numbers
        setInterval(updateDashboard, 10); 
    </script>
</body>
</html>
