<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priyanka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#fbfbfd;--card:rgba(255,255,255,.78);--text:#1d1d1f;--muted:#86868b;--accent:#0071e3;--ok:#248a3d;
  --line:rgba(0,0,0,.08);--cell:rgba(0,0,0,.09);--bar:rgba(251,251,253,.72);--glow:rgba(0,113,227,.1);--shadow:0 24px 60px rgba(0,0,0,.1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;--ease:cubic-bezier(.16,1,.3,1);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#000;--card:rgba(28,28,30,.72);--text:#f5f5f7;--accent:#2997ff;--ok:#30d158;--line:rgba(255,255,255,.08);--cell:rgba(255,255,255,.1);
  --bar:rgba(0,0,0,.72);--glow:rgba(41,151,255,.16);--shadow:0 24px 60px rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000;--card:rgba(28,28,30,.72);--text:#f5f5f7;--accent:#2997ff;--ok:#30d158;--line:rgba(255,255,255,.08);--cell:rgba(255,255,255,.1);
  --bar:rgba(0,0,0,.72);--glow:rgba(41,151,255,.16);--shadow:0 24px 60px rgba(0,0,0,.6);color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .6s var(--ease),color .6s var(--ease)}
body::before{content:"";position:fixed;top:-25vh;left:-20vw;width:70vw;height:70vw;z-index:-1;pointer-events:none;background:radial-gradient(circle,var(--glow),transparent 70%);filter:blur(80px);animation:drift 22s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(12vw,10vh) scale(1.1)}}
.sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:60}
#prog{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:var(--accent);z-index:61}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;height:52px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;
  background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--line)}
.brand{font-weight:600;font-size:1.05rem;letter-spacing:-.02em}
.tools{display:flex;gap:6px}
.ib{background:none;border:0;color:var(--text);width:36px;height:36px;border-radius:50%;font-size:1.1rem;cursor:pointer;transition:transform .5s var(--ease),background .4s var(--ease)}
.ib:hover{background:rgba(128,128,128,.18);transform:scale(1.1)}
main{max-width:820px;margin:0 auto;padding:72px 20px 100px;display:flex;flex-direction:column;gap:28px}
.hero{text-align:center;padding:48px 0 32px}
.hero h1{font-size:clamp(2.8rem,9vw,5.2rem);font-weight:800;letter-spacing:-.045em;line-height:1.05;min-height:1.1em;
  background:linear-gradient(180deg,var(--text) 35%,var(--muted));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
@media(max-width:640px){.hero h1{min-height:2.1em}}
.caret{display:inline-block;width:3px;height:.8em;background:var(--accent);margin-left:6px;vertical-align:-.05em;animation:bl 1s step-end infinite}
@keyframes bl{50%{opacity:0}}
.hero p{margin-top:14px;font-size:1.15rem;color:var(--muted);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.card{background:var(--card);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);border:1px solid var(--line);border-radius:32px;padding:36px;
  box-shadow:0 8px 30px rgba(0,0,0,.12);display:flex;flex-direction:column;transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.js .r{opacity:0;transform:translateY(36px) scale(.98);transition:opacity 1s var(--ease),transform 1s var(--ease),box-shadow .6s var(--ease)}
.js .r.in{opacity:1;transform:none}
.js .r.in:hover{transform:translateY(-4px)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}.card{padding:28px;border-radius:28px}}
.k{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.pill{background:rgba(128,128,128,.16);color:var(--text);border:0;padding:9px 18px;border-radius:30px;font:500 .85rem var(--font);letter-spacing:-.01em;cursor:pointer;transition:transform .4s var(--ease),background .4s var(--ease)}
.pill:hover{background:rgba(128,128,128,.26);transform:scale(1.05)}.pill:active{transform:scale(.95)}.pill:disabled{opacity:.4;pointer-events:none}
.pill.go{background:var(--accent);color:#fff;font-weight:600}
.big{font-size:clamp(2.6rem,9vw,4.2rem);font-weight:800;letter-spacing:-.05em;line-height:1.05;font-variant-numeric:tabular-nums;word-break:break-word}
.big span{font-size:.4em;font-weight:600;color:var(--muted);letter-spacing:-.02em}
.sub{margin-top:12px;font-size:.95rem;color:var(--muted);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.sub b{color:var(--text);font-weight:600}
.wk{display:grid;grid-template-columns:minmax(0,340px) 1fr;gap:40px;align-items:center}
@media(max-width:640px){.wk{grid-template-columns:1fr;gap:24px}}
#weeks{width:100%;display:block}
.stats{display:grid;gap:26px}
.stats .big{font-size:clamp(2.4rem,7vw,3.6rem)}
.lab{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.ringbox{position:relative;width:min(190px,100%);aspect-ratio:1;margin:4px auto 22px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:9;stroke-linecap:round}
.ringbox .t{stroke:var(--cell)}.ringbox .p{stroke:var(--accent);transition:stroke .6s var(--ease)}
.tx{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 16px;font-size:2.4rem;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.focus.done .p{stroke:var(--ok)}.focus.done .tx{color:var(--ok);font-size:1.5rem;animation:fl 1s ease-in-out infinite}
@keyframes fl{50%{opacity:.25}}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:auto}
.habit{margin:auto 0;display:flex;align-items:baseline;gap:10px}
.habit .big{font-size:clamp(4rem,12vw,5.5rem)}
.habit em{font-style:normal;color:var(--muted)}
.row{display:flex;gap:10px}
.row input{flex:1;min-width:0;background:rgba(128,128,128,.1);border:1px solid transparent;color:var(--text);padding:16px 20px;border-radius:18px;font:500 1rem var(--font);outline:0;transition:all .4s var(--ease)}
.row input:focus{border-color:var(--accent);background:transparent;box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.row button{background:var(--text);color:var(--bg);border:0;padding:0 24px;border-radius:18px;font:600 1rem var(--font);cursor:pointer;transition:transform .4s var(--ease)}
.row button:hover{transform:scale(1.04)}.row button:active{transform:scale(.96)}
ul{list-style:none;margin-top:16px;display:grid;gap:10px}
li{display:flex;align-items:center;gap:14px;padding:14px 18px;background:rgba(128,128,128,.08);border-radius:18px;animation:up .6s var(--ease) both;overflow-wrap:anywhere}
@keyframes up{from{opacity:0;transform:translateY(12px)}}
li .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);background:none;color:transparent;cursor:pointer;flex-shrink:0;display:grid;place-items:center;font-size:.75rem;transition:all .4s var(--ease)}
li .chk:hover{border-color:var(--accent);transform:scale(1.12)}
li.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
li span{flex:1}li.done span{text-decoration:line-through;color:var(--muted)}
li .del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.05rem;transition:all .3s var(--ease)}
li .del:hover{color:#ff453a;transform:scale(1.2)}
.empty{color:var(--muted);padding:6px 2px}
.quote{text-align:center;color:var(--muted);font-size:1.1rem;font-style:italic;line-height:1.5;padding:8px 20px;letter-spacing:-.01em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="sbar"></div><div id="prog"></div>
<nav><span class="brand">Priyanka</span><span class="tools"><button class="ib" id="musicBtn" aria-label="Play or pause music">♪</button><button class="ib" id="themeBtn" aria-label="Toggle theme">🌙</button></span></nav>
<main>
  <section class="hero"><h1><span id="greeting"></span><i class="caret"></i></h1><p id="clock">Loading…</p></section>

  <div class="grid2">
    <div class="card r"><div class="k"><span>Current age</span><button class="pill" id="fmtBtn">Switch</button></div><div class="big" id="age">0</div><div class="sub"><b id="remain">0</b> years remaining</div></div>
    <div class="card r"><div class="k"><span>Next birthday</span></div><div class="big" id="bday">…</div><div class="sub" id="bdayDate"></div></div>
  </div>

  <div class="card r"><div class="k"><span>Your life in weeks</span><span id="lifePct">0%</span></div>
    <div class="wk"><canvas id="weeks"></canvas>
      <div class="stats"><div><div class="lab">Weeks lived</div><div class="big" id="wk">0</div></div><div><div class="lab">Weeks left</div><div class="big" id="wkLeft">0</div></div></div>
    </div>
  </div>

  <div class="grid2">
    <div class="card r focus" id="focus"><div class="k"><span>Focus</span><span>25 min</span></div>
      <div class="ringbox"><svg viewBox="0 0 200 200"><circle class="t" cx="100" cy="100" r="90"/><circle class="p" id="ring" cx="100" cy="100" r="90"/></svg><div class="tx" id="ftime">25:00</div></div>
      <div class="btns"><button class="pill go" id="fStart">Start</button><button class="pill" id="fPause" disabled>Pause</button><button class="pill" id="fReset">Reset</button></div>
    </div>
    <div class="card r"><div class="k"><span>Habit streak</span><button class="pill go" id="logBtn">Log today</button></div>
      <div class="habit"><div class="big" id="streak">0</div><em>days 🔥</em></div>
      <div class="sub">Show up daily. Keep the chain alive.</div>
    </div>
  </div>

  <div class="card r"><div class="k"><span>Bucket list</span><span id="cnt"></span></div>
    <div class="row"><input id="taskIn" type="text" placeholder="Add a life goal…" maxlength="40"><button id="addBtn">Add</button></div><ul id="list"></ul>
  </div>

  <p class="quote" id="quote"></p>
</main>

<script>
// ---- Birth date & time: Dec 24, 2000 at 3:30 AM ----
const BIRTH = new Date(2000, 11, 24, 3, 30, 0);
const LIFESPAN = 80;

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const YEAR = 365.2425 * 864e5, WEEK = 6048e5, pad = n => String(n).padStart(2, '0');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
document.documentElement.classList.add('js');

// Theme
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(t){
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  $('themeBtn').textContent = (t ? t === 'dark' : mq.matches) ? '☀️' : '🌙';
  if (window.weeksReady) drawWeeks();
}
applyTheme(store.get('theme', null));
$('themeBtn').onclick = () => {
  const dark = (document.documentElement.dataset.theme || (mq.matches ? 'dark' : 'light')) === 'dark';
  const t = dark ? 'light' : 'dark'; store.set('theme', t); applyTheme(t);
};

// Typewriter greeting
const hr = new Date().getHours();
const msg = (hr < 5 ? 'Good night' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening') + ', Priyanka.';
let ti = 0;
(function type(){ $('greeting').textContent = msg.slice(0, ++ti); if (ti < msg.length) setTimeout(type, 70); })();

// Age, remaining, birthday
let detailed = false;
$('fmtBtn').onclick = () => { detailed = !detailed; };
function tick(){
  const now = new Date(), ms = now - BIRTH, age = ms / YEAR;
  $('clock').textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' }) + ' · ' + now.toLocaleTimeString();
  if (detailed) $('age').innerHTML = Math.floor(ms / 864e5).toLocaleString() + '<span> days</span>';
  else { const s = age.toFixed(8), d = s.indexOf('.'); $('age').innerHTML = s.slice(0, d) + '<span>' + s.slice(d) + '</span>'; }
  $('remain').textContent = Math.max(0, LIFESPAN - age).toFixed(6);
  let next = new Date(now.getFullYear(), BIRTH.getMonth(), BIRTH.getDate());
  if (next <= now) next = new Date(now.getFullYear() + 1, BIRTH.getMonth(), BIRTH.getDate());
  const d = next - now;
  $('bday').innerHTML = Math.floor(d / 864e5) + '<span>d </span>' + pad(Math.floor(d / 36e5) % 24) + '<span>h </span>' + pad(Math.floor(d / 6e4) % 60) + '<span>m </span>' + pad(Math.floor(d / 1e3) % 60) + '<span>s</span>';
  $('bdayDate').textContent = next.toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });
}
setInterval(tick, 50); tick();

// Life in weeks (grid cached; only this week pulses)
const wc = $('weeks'), wx = wc.getContext('2d'), COLS = 52, ROWS = LIFESPAN, base = document.createElement('canvas');
let wD = null, pulse = 0, pdir = 1, lastP = 0;
function drawWeeks(){
  const w = wc.clientWidth || 340, cell = w / COLS, h = Math.ceil(cell * ROWS), dpr = devicePixelRatio || 1;
  const lived = Math.floor((Date.now() - BIRTH) / WEEK), sz = cell - Math.max(1, cell * .22);
  wD = { cell, sz, lived, dpr, hi: css('--text') };
  wc.width = base.width = Math.round(w * dpr); wc.height = base.height = Math.round(h * dpr); wc.style.height = h + 'px';
  const bx = base.getContext('2d'); bx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const on = css('--accent'), off = css('--cell');
  for (let i = 0; i < COLS * ROWS; i++){
    const x = (i % COLS) * cell, y = Math.floor(i / COLS) * cell;
    bx.globalAlpha = i < lived ? .5 + .5 * (i / Math.max(1, lived)) : 1; bx.fillStyle = i < lived ? on : off;
    bx.beginPath(); bx.roundRect ? bx.roundRect(x, y, sz, sz, sz * .3) : bx.rect(x, y, sz, sz); bx.fill();
  }
  $('wk').textContent = lived.toLocaleString();
  $('wkLeft').textContent = Math.max(0, COLS * ROWS - lived).toLocaleString();
  $('lifePct').textContent = Math.min(100, (Date.now() - BIRTH) / YEAR / LIFESPAN * 100).toFixed(2) + '%';
  paintWeeks();
}
function paintWeeks(){
  if (!wD) return;
  const { cell, sz, lived, dpr, hi } = wD;
  wx.setTransform(1, 0, 0, 1, 0, 0); wx.clearRect(0, 0, wc.width, wc.height); wx.drawImage(base, 0, 0);
  wx.setTransform(dpr, 0, 0, dpr, 0, 0);
  wx.globalAlpha = .3 + .7 * pulse; wx.fillStyle = hi;
  wx.beginPath(); wx.arc((lived % COLS) * cell + sz / 2, Math.floor(lived / COLS) * cell + sz / 2, sz * (.7 + .3 * pulse), 0, 6.2832); wx.fill(); wx.globalAlpha = 1;
}
(function loop(t){ if (t - lastP > 60){ lastP = t; pulse += .1 * pdir; if (pulse >= 1 || pulse <= 0) pdir *= -1; paintWeeks(); } requestAnimationFrame(loop); })(0);
addEventListener('resize', drawWeeks); setInterval(drawWeeks, 3600e3);
drawWeeks(); window.weeksReady = true;

// Focus timer
const FOCUS_MS = 25 * 60 * 1000, LEN = 2 * Math.PI * 90, ring = $('ring');
ring.style.strokeDasharray = LEN;
let left = FOCUS_MS, endAt = 0, raf = 0, running = false;
function drawF(){
  const s = Math.ceil(left / 1000);
  $('ftime').textContent = left <= 0 ? 'Time’s Up!' : pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  ring.style.strokeDashoffset = LEN * (1 - left / FOCUS_MS);
  document.title = running && left > 0 ? $('ftime').textContent + ' · Focus' : 'Priyanka';
}
function frame(){
  left = Math.max(0, endAt - Date.now()); drawF();
  if (left <= 0){ running = false; $('focus').classList.add('done'); $('fStart').disabled = $('fPause').disabled = true; return; }
  raf = requestAnimationFrame(frame);
}
$('fStart').onclick = () => { if (running || left <= 0) return; running = true; endAt = Date.now() + left; $('fStart').disabled = true; $('fPause').disabled = false; raf = requestAnimationFrame(frame); };
$('fPause').onclick = () => { if (!running) return; running = false; cancelAnimationFrame(raf); left = Math.max(0, endAt - Date.now()); drawF(); $('fStart').disabled = false; $('fPause').disabled = true; };
$('fReset').onclick = () => { running = false; cancelAnimationFrame(raf); left = FOCUS_MS; $('focus').classList.remove('done'); drawF(); $('fStart').disabled = false; $('fPause').disabled = true; };
drawF();

// Habit streak
const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
function streakNow(){
  const s = store.get('habit', { count: 0, last: '' }), y = new Date(); y.setDate(y.getDate() - 1);
  return (s.last === dayKey(new Date()) || s.last === dayKey(y)) ? s : { count: 0, last: s.last };
}
function renderHabit(){
  const s = streakNow(), done = s.last === dayKey(new Date());
  $('streak').textContent = s.count; $('logBtn').textContent = done ? 'Logged ✓' : 'Log today'; $('logBtn').disabled = done;
}
$('logBtn').onclick = () => { const s = streakNow(); if (s.last === dayKey(new Date())) return; store.set('habit', { count: s.count + 1, last: dayKey(new Date()) }); renderHabit(); };
renderHabit();

// Bucket list
let tasks = store.get('tasks', []);
function renderTasks(){
  const ul = $('list'); ul.innerHTML = '';
  $('cnt').textContent = tasks.length ? tasks.filter(t => t.done).length + ' / ' + tasks.length : '';
  if (!tasks.length){ const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nothing here yet. What do you want to do in this life?'; ul.append(e); return; }
  tasks.forEach((t, i) => {
    const li = document.createElement('li'); if (t.done) li.className = 'done';
    const c = document.createElement('button'); c.className = 'chk'; c.textContent = '✓'; c.setAttribute('aria-label', 'Complete');
    c.onclick = () => { tasks[i].done = !tasks[i].done; store.set('tasks', tasks); renderTasks(); };
    const sp = document.createElement('span'); sp.textContent = t.text;
    const d = document.createElement('button'); d.className = 'del'; d.textContent = '✕'; d.setAttribute('aria-label', 'Delete');
    d.onclick = () => { tasks.splice(i, 1); store.set('tasks', tasks); renderTasks(); };
    li.append(c, sp, d); ul.append(li);
  });
}
function addTask(){ const v = $('taskIn').value.trim(); if (!v) return; tasks.push({ text: v, done: false }); store.set('tasks', tasks); $('taskIn').value = ''; renderTasks(); }
$('addBtn').onclick = addTask;
$('taskIn').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
renderTasks();

// Daily quote
const quotes = ['“The best way to predict the future is to create it.”', '“Stay hungry, stay foolish.”', '“Simplicity is the ultimate sophistication.”', '“Well done is better than well said.”', '“Make each day your masterpiece.”', '“Small steps every day add up to something extraordinary.”'];
$('quote').textContent = quotes[Math.floor(Date.now() / 864e5) % quotes.length];

// Smooth reveals + scroll progress
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
if ('IntersectionObserver' in window){
  const io = new IntersectionObserver(es => es.forEach((e, k) => { if (e.isIntersecting){ setTimeout(() => e.target.classList.add('in'), k * 90); io.unobserve(e.target); } }), { threshold: .1 });
  document.querySelectorAll('.r').forEach(c => io.observe(c));
} else document.querySelectorAll('.r').forEach(c => c.classList.add('in'));
let sTick = false;
function onScroll(){
  const max = document.documentElement.scrollHeight - innerHeight;
  $('prog').style.transform = 'scaleX(' + (max > 0 ? scrollY / max : 0) + ')'; sTick = false;
}
addEventListener('scroll', () => { if (!sTick){ sTick = true; requestAnimationFrame(onScroll); } }, { passive: true });
onScroll();

// Music: original raga-style ambient, generated live (no audio files, no copyright)
let ac = null, bus = null, master = null, timer = null, stopT = 0, playing = false, nextTan = 0, tanStep = 0, nextMel = 0, melIdx = 5, lastHz = 0;
const mBtn = $('musicBtn'), hz = m => 440 * Math.pow(2, (m - 69) / 12);
const SA = 62, SCALE = [0, 2, 4, 7, 9, 12, 14, 16, 19, 21].map(x => SA + x), TANPURA = [SA - 5, SA, SA, SA - 12];
function setupAudio(){
  const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return false;
  ac = new AC(); master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
  const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 3200;
  const dly = ac.createDelay(1); dly.delayTime.value = .5;
  const fb = ac.createGain(); fb.gain.value = .45; const wet = ac.createGain(); wet.gain.value = .45;
  lp.connect(master); lp.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(master);

}
function pluck(m, t){
  const o = ac.createOscillator(), f = ac.createBiquadFilter(), g = ac.createGain();
  o.type = 'sawtooth'; o.frequency.value = hz(m); f.type = 'lowpass';
  f.frequency.setValueAtTime(2600, t); f.frequency.exponentialRampToValueAtTime(500, t + 2.5);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.05, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + 5);
  o.connect(f); f.connect(g); g.connect(bus); o.start(t); o.stop(t + 5.2);
}
function sing(m, t, dur){
  const f = hz(m), o = ac.createOscillator(), o2 = ac.createOscillator(), m2 = ac.createGain(), g = ac.createGain(), v = ac.createOscillator(), vg = ac.createGain();
  o.type = 'sine'; o2.type = 'triangle'; m2.gain.value = .25;
  [o, o2].forEach(x => { x.frequency.setValueAtTime(lastHz || f, t); x.frequency.exponentialRampToValueAtTime(f, t + .18); });
  lastHz = f; v.frequency.value = 5.2; vg.gain.value = 7; v.connect(vg); vg.connect(o.detune); vg.connect(o2.detune);
  g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.09, t + .4); g.gain.setValueAtTime(.09, t + dur * .6); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); o2.connect(m2); m2.connect(g); g.connect(bus);
  [o, o2, v].forEach(x => { x.start(t); x.stop(t + dur + .2); });
}
function schedule(){
  const now = ac.currentTime;
  while (nextTan < now + .6){ pluck(TANPURA[tanStep++ % 4], nextTan); nextTan += 1.5; }
  while (nextMel < now + .6){
    melIdx = Math.max(0, Math.min(SCALE.length - 1, melIdx + [-2, -1, -1, 0, 1, 1, 2][Math.floor(Math.random() * 7)]));
    if (Math.random() < .1) melIdx = 0;
    const dur = [1.4, 2, 2.6, 3.2][Math.floor(Math.random() * 4)];
    sing(SCALE[melIdx], nextMel, dur); nextMel += dur * .9 + (Math.random() < .25 ? 1.2 : 0);
  }
}
function setMusicUI(on){ playing = on; mBtn.textContent = on ? '⏸' : '♪'; }
function playMusic(){
  if (!ac && !setupAudio()) return;
  clearTimeout(stopT); ac.resume(); nextTan = nextMel = ac.currentTime + .1; lastHz = 0;
  master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(master.gain.value, ac.currentTime); master.gain.linearRampToValueAtTime(.9, ac.currentTime + 2);
  clearInterval(timer); timer = setInterval(schedule, 200); schedule(); setMusicUI(true);
}
function stopMusic(){
  if (!ac) return;
  master.gain.cancelScheduledValues(ac.currentTime); master.gain.setValueAtTime(master.gain.value, ac.currentTime); master.gain.linearRampToValueAtTime(0, ac.currentTime + .8);
  clearInterval(timer); stopT = setTimeout(() => ac.suspend(), 1000); setMusicUI(false);
}
mBtn.onclick = () => playing ? stopMusic() : playMusic();
