<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priyanka | Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#000;--card:rgba(28,28,30,.72);--card-hover:rgba(44,44,46,.82);--text:#f5f5f7;--muted:#86868b;
  --accent:#2997ff;--success:#30d158;--danger:#ff453a;--border:rgba(255,255,255,.08);--glow:rgba(41,151,255,.16);
  --bar:rgba(0,0,0,.72);--shadow:0 20px 50px rgba(0,0,0,.55);--dot:rgba(255,255,255,.22);
  --ease:cubic-bezier(.16,1,.3,1);color-scheme:dark;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  --bg:#fbfbfd;--card:rgba(255,255,255,.8);--card-hover:#fff;--text:#1d1d1f;--accent:#0071e3;--border:rgba(0,0,0,.08);
  --glow:rgba(0,113,227,.12);--bar:rgba(251,251,253,.72);--shadow:0 20px 50px rgba(0,0,0,.1);--dot:rgba(0,113,227,.25);color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .6s var(--ease),color .6s var(--ease)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:101}
.glow{position:fixed;top:-20vh;left:-20vw;width:70vw;height:70vw;background:radial-gradient(circle,var(--glow),transparent 70%);filter:blur(80px);z-index:-1;pointer-events:none;animation:drift 20s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(12vw,10vh) scale(1.12)}}
#particles{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:52px;display:flex;justify-content:space-between;align-items:center;padding:0 24px;
  background:var(--bar);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:1px solid var(--border);z-index:100}
.brand{font-weight:600;font-size:1.1rem;letter-spacing:-.02em}
.icon-btn{background:none;border:0;color:var(--text);font-size:1.2rem;cursor:pointer;transition:transform .5s var(--ease)}
.icon-btn:hover{transform:scale(1.15) rotate(15deg)}
main{max-width:860px;margin:0 auto;padding:140px 20px 100px;display:flex;flex-direction:column;gap:32px}
.hero{text-align:center;margin-bottom:24px}
.hero h1{font-size:clamp(2.8rem,8vw,5rem);font-weight:800;letter-spacing:-.045em;line-height:1.05;min-height:1.15em;
  background:linear-gradient(180deg,var(--text) 30%,var(--muted));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.cursor{display:inline-block;width:3px;height:.9em;background:var(--accent);margin-left:6px;vertical-align:-.05em;animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:0}}
.hero p{margin-top:14px;font-size:1.25rem;color:var(--muted);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.card{position:relative;overflow:hidden;background:var(--card);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);
  border:1px solid var(--border);border-radius:32px;padding:36px;box-shadow:0 8px 30px rgba(0,0,0,.18);
  transition:transform .6s var(--ease),box-shadow .6s var(--ease),background .6s var(--ease);animation:rise .9s var(--ease) both}
.card:hover{transform:translateY(-6px) scale(1.01);box-shadow:var(--shadow);background:var(--card-hover)}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px}
@media(max-width:640px){.grid{grid-template-columns:1fr}.card{padding:28px;border-radius:28px}}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.title{display:flex;align-items:center;gap:8px;font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.title svg{width:16px;height:16px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.big{font-size:clamp(1.9rem,6vw,3.1rem);font-weight:800;letter-spacing:-.04em;font-variant-numeric:tabular-nums;line-height:1.1;word-break:break-word}
.big small{font-size:.45em;color:var(--muted);font-weight:600;letter-spacing:-.02em}
.btn{background:rgba(128,128,128,.18);color:var(--text);border:0;padding:9px 18px;border-radius:30px;font:500 .85rem Inter,sans-serif;letter-spacing:-.01em;cursor:pointer;transition:transform .4s var(--ease),background .4s var(--ease)}
.btn:hover{background:rgba(128,128,128,.28);transform:scale(1.05)}.btn:active{transform:scale(.95)}
.btn.go{background:var(--success);color:#000;font-weight:600}
.lbl{display:flex;justify-content:space-between;font-size:.9rem;font-weight:500;color:var(--muted);margin-bottom:12px;font-variant-numeric:tabular-nums}
.bar{height:10px;background:rgba(128,128,128,.18);border-radius:10px;overflow:hidden}
.fill{height:100%;width:0;border-radius:10px;background:var(--accent)}.fill.g{background:var(--success)}
.habit{display:flex;justify-content:space-between;align-items:center;gap:12px;background:rgba(128,128,128,.08);padding:22px;border-radius:24px;font-size:1.1rem}
.habit strong{font-size:1.8rem;letter-spacing:-.04em;margin:0 4px}
.row{display:flex;gap:12px}
.row input{flex:1;min-width:0;background:rgba(128,128,128,.1);border:1px solid transparent;color:var(--text);padding:16px 20px;border-radius:20px;font:500 1rem Inter,sans-serif;outline:0;transition:all .4s var(--ease)}
.row input:focus{border-color:var(--accent);background:transparent;box-shadow:0 0 0 4px rgba(41,151,255,.18)}
.row button{background:var(--text);color:var(--bg);border:0;padding:0 26px;border-radius:20px;font:600 1rem Inter,sans-serif;cursor:pointer;transition:transform .4s var(--ease)}
.row button:hover{transform:scale(1.04)}.row button:active{transform:scale(.96)}
ul{list-style:none;margin-top:20px;display:flex;flex-direction:column;gap:12px}
li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;background:rgba(128,128,128,.07);border-radius:20px;animation:rise .6s var(--ease) both;overflow-wrap:anywhere}
li.done span{text-decoration:line-through;color:var(--muted)}
li button{background:none;border:0;cursor:pointer;font-size:1.2rem;margin-left:8px;transition:transform .3s var(--ease)}
li button:hover{transform:scale(1.25)}
.quote{text-align:center;padding:12px 20px;font-size:1.15rem;font-style:italic;color:var(--muted);line-height:1.5;letter-spacing:-.01em}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow"></div>
<canvas id="particles"></canvas>
<header><div class="brand">Priyanka 🐒</div><button class="icon-btn" id="themeBtn" aria-label="Toggle theme">🌙</button></header>
<main>
  <section class="hero"><h1><span id="greeting"></span><span class="cursor"></span></h1><p id="clock">Loading…</p></section>
  <div class="grid">
    <div class="card"><div class="head"><div class="title"><svg viewBox="0 0 24 24"><path d="M6 2v6l4 4-4 4v6h12v-6l-4-4 4-4V2z"/></svg>Current Age</div><button class="btn" id="fmtBtn">Switch</button></div><div class="big" id="age">0</div></div>
    <div class="card"><div class="head"><div class="title"><svg viewBox="0 0 24 24"><path d="M12 12c-2-2.7-4-4-6-4a4 4 0 100 8c2 0 4-1.3 6-4zm0 0c2 2.7 4 4 6 4a4 4 0 100-8c-2 0-4 1.3-6 4z"/></svg>Years Remaining</div></div><div class="big" id="remain">0</div></div>
  </div>
  <div class="card"><div class="head"><div class="title"><svg viewBox="0 0 24 24"><path d="M20 21v-8a2 2 0 00-2-2H6a2 2 0 00-2 2v8M4 16s.5-1 2-1 2.5 2 4 2 2.500-2 4-2 2.5 2 4 2 2-1 2-1M12 7v4"/></svg>Next Birthday</div></div><div class="big" id="bday">Calculating…</div></div>
  <div class="card">
    <div class="lbl"><span>Life Progress</span><span id="lifePct">0%</span></div><div class="bar"><div class="fill" id="lifeFill"></div></div>
    <div class="lbl" style="margin-top:32px"><span>Today’s Progress</span><span id="dayPct">0%</span></div><div class="bar"><div class="fill g" id="dayFill"></div></div>
  </div>
  <div class="card"><div class="head"><div class="title"><svg viewBox="0 0 24 24"><path d="M8.5 14.5A2.5 2.5 0 0011 12c0-1.4-.5-2-1-3-1.100-2.100-.2-4 2-6 .5 2.500 2 4.900 4 6.500 2 1.600 3 3.500 3 5.500a7 7 0 11-14 0c0-1.200.4-2.300 1-3a2.500 2.500 0 002.500 2.500z"/></svg>Daily Habit Streak</div></div>
    <div class="habit"><div><span>🔥</span><strong id="streak">0</strong>day streak</div><button class="btn go" id="logBtn">Log Today</button></div></div>
  <div class="card"><div class="head"><div class="title"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Bucket List</div></div>
    <div class="row"><input id="taskIn" type="text" placeholder="Add a life goal…" maxlength="40"><button id="addBtn">Add</button></div><ul id="list"></ul></div>
  <div class="quote" id="quote"></div>
</main>
<script>
// ---- Priyanka's Exact Birth Date & Time: Dec 24, 2000 at 3:30 AM ----
const BIRTH = new Date(2000, 11, 24, 3, 30, 0); 
const LIFESPAN = 80;

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const YEAR = 365.2425 * 864e5, pad = n => String(n).padStart(2, '0');

// Theme
function setTheme(t){ document.documentElement.dataset.theme = t; $('themeBtn').textContent = t === 'light' ? '☀️' : '🌙'; store.set('theme', t); }
setTheme(store.get('theme', 'dark'));
$('themeBtn').onclick = () => setTheme(document.documentElement.dataset.theme === 'light' ? 'dark' : 'light');

// Typewriter greeting with Monkey Emoji
const h = new Date().getHours();
const msg = (h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening') + ', Priyanka 🐒.';
let ti = 0;
(function type(){ $('greeting').textContent = msg.slice(0, ++ti); if (ti < msg.length) setTimeout(type, 70); })();

// Age display
let detailed = false;
$('fmtBtn').onclick = () => { detailed = !detailed; };

function tick(){
  const now = new Date(), ms = now - BIRTH, age = ms / YEAR;
  $('clock').textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' }) + ' · ' + now.toLocaleTimeString();
  if (detailed){
    const d = Math.floor(ms / 864e5);
    $('age').innerHTML = d.toLocaleString() + '<small> days</small><br><small>' + pad(Math.floor(ms / 36e5) % 24) + ':' + pad(Math.floor(ms / 6e4) % 60) + ':' + pad(Math.floor(ms / 1e3) % 60) + '</small>';
  } else $('age').textContent = age.toFixed(9);
  $('remain').textContent = Math.max(0, LIFESPAN - age).toFixed(8);
  const lp = Math.min(100, age / LIFESPAN * 100);
  $('lifePct').textContent = lp.toFixed(4) + '%'; $('lifeFill').style.width = lp + '%';
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()), dp = (now - start) / 864e5 * 100;
  $('dayPct').textContent = dp.toFixed(3) + '%'; $('dayFill').style.width = dp + '%';
  let next = new Date(now.getFullYear(), BIRTH.getMonth(), BIRTH.getDate());
  if (next <= now) next = new Date(now.getFullYear() + 1, BIRTH.getMonth(), BIRTH.getDate());
  const diff = next - now;
  $('bday').innerHTML = Math.floor(diff / 864e5) + '<small>d </small>' + pad(Math.floor(diff / 36e5) % 24) + '<small>h </small>' + pad(Math.floor(diff / 6e4) % 60) + '<small>m </small>' + pad(Math.floor(diff / 1e3) % 60) + '<small>s</small>';
}
setInterval(tick, 10); tick(); // Super fast numbers

// Habit streak
const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
function streakNow(){
  const s = store.get('habit', { count: 0, last: '' }), y = new Date(); y.setDate(y.getDate() - 1);
  return (s.last === dayKey(new Date()) || s.last === dayKey(y)) ? s : { count: 0, last: s.last };
}
function renderHabit(){
  const s = streakNow(), done = s.last === dayKey(new Date());
  $('streak').textContent = s.count;
  $('logBtn').textContent = done ? 'Logged ✓' : 'Log Today'; $('logBtn').disabled = done; $('logBtn').style.opacity = done ? .5 : 1;
}
$('logBtn').onclick = () => { const s = streakNow(); if (s.last === dayKey(new Date())) return; store.set('habit', { count: s.count + 1, last: dayKey(new Date()) }); renderHabit(); };
renderHabit();

// Bucket list
let tasks = store.get('tasks', []);
function renderTasks(){
  const ul = $('list'); ul.innerHTML = '';
  tasks.forEach((t, i) => {
    const li = document.createElement('li'); if (t.done) li.className = 'done';
    const sp = document.createElement('span'); sp.textContent = t.text;
    const box = document.createElement('div');
    const ok = document.createElement('button'); ok.textContent = '✅'; ok.setAttribute('aria-label', 'Complete');
    ok.onclick = () => { tasks[i].done = !tasks[i].done; store.set('tasks', tasks); renderTasks(); };
    const del = document.createElement('button'); del.textContent = '🗑️'; del.setAttribute('aria-label', 'Delete');
    del.onclick = () => { tasks.splice(i, 1); store.set('tasks', tasks); renderTasks(); };
    box.append(ok, del); li.append(sp, box); ul.append(li);
  });
}
function addTask(){ const v = $('taskIn').value.trim(); if (!v) return; tasks.push({ text: v, done: false }); store.set('tasks', tasks); $('taskIn').value = ''; renderTasks(); }
$('addBtn').onclick = addTask;
$('taskIn').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
renderTasks();

// Daily quote
const quotes = [
  '“The best way to predict the future is to create it.”',
  '“Stay hungry, stay foolish.”',
  '“Simplicity is the ultimate sophistication.”',
  '“Well done is better than well said.”',
  '“Make each day your masterpiece.”',
  '“Small steps every day add up to something extraordinary.”',
  '“The only way to do great work is to love what you do.”'
];
$('quote').textContent = quotes[Math.floor(Date.now() / 864e5) % quotes.length];

// Particles
const cv = $('particles'), cx = cv.getContext('2d'); let ps = [];
function initP(){
  cv.width = innerWidth; cv.height = innerHeight; ps = [];
  const n = Math.min(160, cv.width * cv.height / 12000);
  for (let i = 0; i < n; i++) ps.push({ x: Math.random() * cv.width, y: Math.random() * cv.height, r: Math.random() * 1.5 + .5, vx: Math.random() * .3 - .15, vy: Math.random() * .3 - .15 });
}
addEventListener('resize', initP); initP();
(function loop(){
  cx.clearRect(0, 0, cv.width, cv.height);
  cx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--dot');
  ps.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > cv.width) p.vx *= -1;
    if (p.y < 0 || p.y > cv.height) p.vy *= -1;
    cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.2832); cx.fill();
  });
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
