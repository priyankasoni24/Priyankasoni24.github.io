<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Priyanka | Life Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#f6f1e7;--card:#fffaf0;--text:#1b1813;--muted:#8a8274;--line:rgba(27,24,19,.1);
  --accent:#e2551f;--gold:#c98a1b;--ok:#2f9e5b;--cell:rgba(27,24,19,.1);--glow1:rgba(226,85,31,.16);--glow2:rgba(201,138,27,.14);
  --serif:Fraunces,"Iowan Old Style",Georgia,serif;--sans:Inter,-apple-system,system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1);color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0b0a;--card:#151311;--text:#f4efe6;--muted:#8c857a;--line:rgba(244,239,230,.09);
  --accent:#ff7a45;--gold:#f5c26b;--ok:#8fd694;--cell:rgba(244,239,230,.09);--glow1:rgba(255,122,69,.15);--glow2:rgba(245,194,107,.1);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0b0a;--card:#151311;--text:#f4efe6;--muted:#8c857a;--line:rgba(244,239,230,.09);
  --accent:#ff7a45;--gold:#f5c26b;--ok:#8fd694;--cell:rgba(244,239,230,.09);--glow1:rgba(255,122,69,.15);--glow2:rgba(245,194,107,.1);color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .6s var(--ease),color .6s var(--ease)}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;
  background:radial-gradient(40% 35% at 15% 10%,var(--glow1),transparent 70%),radial-gradient(35% 30% at 90% 85%,var(--glow2),transparent 70%);animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(4%,3%) scale(1.08)}}
.wrap{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top b{color:var(--text);font-weight:600}
.tbtn{background:none;border:1px solid var(--line);color:var(--text);width:40px;height:40px;border-radius:50%;font-size:1.05rem;cursor:pointer;transition:transform .5s var(--ease)}
.tbtn:hover{transform:rotate(25deg) scale(1.08)}
.hero{padding:72px 0 56px}
.hero h1{font-family:var(--serif);font-weight:350;font-size:clamp(2.8rem,9vw,6.4rem);line-height:.98;letter-spacing:-.035em;min-height:2em;font-variation-settings:"opsz" 144}
.hero h1 em{font-style:italic;color:var(--accent)}
.caret{display:inline-block;width:3px;height:.75em;background:var(--accent);margin-left:6px;vertical-align:-.02em;animation:bl 1s step-end infinite}
@keyframes bl{50%{opacity:0}}
.hero p{margin-top:20px;font-family:var(--mono);font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bento{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}
.card{grid-column:span 2;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:28px;position:relative;overflow:hidden;
  animation:up .9s var(--ease) both;animation-delay:calc(var(--i,0)*70ms);transition:transform .6s var(--ease),border-color .6s var(--ease)}
.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
@keyframes up{from{opacity:0;transform:translateY(28px)}}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}
@media(max-width:820px){.card,.s3,.s4{grid-column:span 6}.card{padding:24px;border-radius:24px}.hero{padding:48px 0 36px}}
.k{font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px}
.pill{background:none;border:1px solid var(--line);color:var(--text);padding:7px 15px;border-radius:99px;font:500 .8rem var(--sans);cursor:pointer;transition:all .4s var(--ease)}
.pill:hover{background:var(--text);color:var(--bg);transform:scale(1.04)}.pill:active{transform:scale(.96)}
.pill:disabled{opacity:.35;pointer-events:none}
.pill.solid{background:var(--accent);border-color:var(--accent);color:#fff}
.pill.solid:hover{background:var(--accent);filter:brightness(1.1)}
.num{font-family:var(--serif);font-weight:300;font-size:clamp(4rem,12vw,7.5rem);line-height:.95;letter-spacing:-.05em;font-variation-settings:"opsz" 144}
.num span{font-family:var(--mono);font-size:.22em;letter-spacing:-.02em;color:var(--muted);font-weight:500}
.sub{margin-top:14px;font-family:var(--mono);font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sub b{color:var(--text);font-weight:500}
.mid{font-family:var(--serif);font-weight:350;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.mid small{font-family:var(--mono);font-size:.3em;color:var(--muted);margin:0 6px 0 2px}
#weeks{width:100%;display:block;margin-top:6px}
.bar{height:6px;border-radius:9px;background:var(--cell);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:9px}
.ringbox{position:relative;width:min(200px,100%);aspect-ratio:1;margin:0 auto 20px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringbox circle{fill:none;stroke-width:8;stroke-linecap:round}
.ringbox .t{stroke:var(--cell)}.ringbox .p{stroke:var(--accent);transition:stroke .6s var(--ease)}
.ringbox .tx{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 18px;font-family:var(--serif);font-weight:350;font-size:2.7rem;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.focus.done .p{stroke:var(--ok)}
.focus.done .tx{color:var(--ok);font-size:1.6rem;animation:fl 1s ease-in-out infinite}
@keyframes fl{50%{opacity:.25}}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.streak{display:flex;align-items:baseline;gap:10px}
.streak .num{font-size:clamp(4rem,10vw,5.5rem)}
.streak em{font-style:normal;color:var(--muted);font-size:.95rem}
.row{display:flex;gap:10px}
.row input{flex:1;min-width:0;background:transparent;border:1px solid var(--line);color:var(--text);padding:15px 18px;border-radius:18px;font:500 1rem var(--sans);outline:0;transition:all .4s var(--ease)}
.row input:focus{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.row button{background:var(--text);color:var(--bg);border:0;padding:0 24px;border-radius:18px;font:600 .95rem var(--sans);cursor:pointer;transition:transform .4s var(--ease)}
.row button:hover{transform:scale(1.04)}.row button:active{transform:scale(.96)}
ul{list-style:none;margin-top:16px;display:grid;gap:4px}
li{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line);animation:up .6s var(--ease) both;overflow-wrap:anywhere}
li .chk{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);background:none;cursor:pointer;flex-shrink:0;display:grid;place-items:center;color:transparent;font-size:.75rem;transition:all .4s var(--ease)}
li .chk:hover{border-color:var(--accent);transform:scale(1.12)}
li.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
li span{flex:1;font-size:1.02rem}
li.done span{text-decoration:line-through;color:var(--muted)}
li .del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.1rem;transition:all .3s var(--ease)}
li .del:hover{color:#e5484d;transform:scale(1.2)}
.empty{color:var(--muted);font-size:.95rem;padding:14px 4px}
.quote{font-family:var(--serif);font-style:italic;font-weight:300;font-size:clamp(1.3rem,3vw,1.7rem);line-height:1.35;letter-spacing:-.02em;display:flex;align-items:center;height:100%}
.quote-card{background:transparent;border-style:dashed}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span><b>Priyanka</b> · Life dashboard</span><button class="tbtn" id="themeBtn" aria-label="Toggle theme">🌙</button></div>
  <section class="hero"><h1><span id="greeting"></span><span class="caret"></span></h1><p id="clock">Loading…</p></section>

  <div class="bento">
    <div class="card s4" style="--i:0">
      <div class="k"><span>Time on earth</span><button class="pill" id="fmtBtn">Switch</button></div>
      <div class="num" id="age">0</div>
      <div class="sub">of <b id="life">80</b> years · <b id="remain">0</b> remaining</div>
    </div>
    <div class="card" style="--i:1">
      <div class="k"><span>Next birthday</span></div>
      <div class="mid" id="bday">…</div>
      <div class="sub" id="bdayDate"></div>
    </div>

    <div class="card s6" style="--i:2">
      <div class="k"><span>Your life in weeks</span><span id="lifePct">0%</span></div>
      <canvas id="weeks"></canvas>
      <div class="sub">Each square is one week. <b id="wk">0</b> lived, the glowing one is this week.</div>
    </div>

    <div class="card focus" id="focus" style="--i:3">
      <div class="k"><span>Focus</span><span>25 min</span></div>
      <div class="ringbox">
        <svg viewBox="0 0 200 200"><circle class="t" cx="100" cy="100" r="90"/><circle class="p" id="ring" cx="100" cy="100" r="90"/></svg>
        <div class="tx" id="ftime">25:00</div>
      </div>
      <div class="btns"><button class="pill solid" id="fStart">Start</button><button class="pill" id="fPause" disabled>Pause</button><button class="pill" id="fReset">Reset</button></div>
    </div>

    <div class="card" style="--i:4">
      <div class="k"><span>Today</span></div>
      <div class="num" style="font-size:clamp(3.4rem,8vw,4.6rem)"><span id="dayInt">0</span><span style="font-size:.4em;font-family:var(--serif)">%</span></div>
      <div class="sub" id="dayLeft"></div>
      <div class="bar"><i id="dayFill"></i></div>
    </div>

    <div class="card" style="--i:5">
      <div class="k"><span>Habit streak</span><button class="pill solid" id="logBtn">Log today</button></div>
      <div class="streak"><div class="num" id="streak">0</div><em>days 🔥</em></div>
      <div class="sub">Show up daily. Keep the chain alive.</div>
    </div>

    <div class="card s4" style="--i:6">
      <div class="k"><span>Bucket list</span><span id="cnt"></span></div>
      <div class="row"><input id="taskIn" type="text" placeholder="Add a life goal…" maxlength="40"><button id="addBtn">Add</button></div>
      <ul id="list"></ul>
    </div>
    <div class="card quote-card" style="--i:7"><div class="quote" id="quote"></div></div>
  </div>
</div>

<script>
// ---- Birth date & time: Dec 24, 2000 at 3:30 AM ----
const BIRTH = new Date(2000, 11, 24, 3, 30, 0);
const LIFESPAN = 80;

const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const YEAR = 365.2425 * 864e5, WEEK = 6048e5, pad = n => String(n).padStart(2, '0');
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

// Theme
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme(t){
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
  const dark = t ? t === 'dark' : mq.matches;
  $('themeBtn').textContent = dark ? '☀️' : '🌙';
  if (window.weeksReady) drawWeeks();
}
applyTheme(store.get('theme', null));
$('themeBtn').onclick = () => {
  const dark = (document.documentElement.dataset.theme || (mq.matches ? 'dark' : 'light')) === 'dark';
  const t = dark ? 'light' : 'dark'; store.set('theme', t); applyTheme(t);
};

// Typewriter greeting
const hr = new Date().getHours();
const msg = (hr < 5 ? 'Good night' : hr < 12 ? 'Good morning' : hr < 18 ? 'Good afternoon' : 'Good evening') + ', Priyanka.';
let ti = 0;
(function type(){ $('greeting').textContent = msg.slice(0, ++ti); if (ti < msg.length) setTimeout(type, 70); })();
$('life').textContent = LIFESPAN;

// Age + clocks
let detailed = false;
$('fmtBtn').onclick = () => { detailed = !detailed; };
function tick(){
  const now = new Date(), ms = now - BIRTH, age = ms / YEAR;
  $('clock').textContent = now.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' }) + '  ·  ' + now.toLocaleTimeString();
  if (detailed){
    $('age').innerHTML = Math.floor(ms / 864e5).toLocaleString() + '<span> days ' + pad(Math.floor(ms / 36e5) % 24) + ':' + pad(Math.floor(ms / 6e4) % 60) + ':' + pad(Math.floor(ms / 1e3) % 60) + '</span>';
  } else {
    const s = age.toFixed(9), dot = s.indexOf('.');
    $('age').innerHTML = s.slice(0, dot) + '<span>' + s.slice(dot) + '</span>';
  }
  $('remain').textContent = Math.max(0, LIFESPAN - age).toFixed(6) + ' yrs';
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()), dp = (now - start) / 864e5 * 100;
  $('dayInt').textContent = dp.toFixed(1); $('dayFill').style.width = dp + '%';
  const left = 864e5 - (now - start);
  $('dayLeft').textContent = pad(Math.floor(left / 36e5)) + ':' + pad(Math.floor(left / 6e4) % 60) + ':' + pad(Math.floor(left / 1e3) % 60) + ' left';
  let next = new Date(now.getFullYear(), BIRTH.getMonth(), BIRTH.getDate());
  if (next <= now) next = new Date(now.getFullYear() + 1, BIRTH.getMonth(), BIRTH.getDate());
  const d = next - now;
  $('bday').innerHTML = Math.floor(d / 864e5) + '<small>d</small>' + pad(Math.floor(d / 36e5) % 24) + '<small>h</small>' + pad(Math.floor(d / 6e4) % 60) + '<small>m</small>' + pad(Math.floor(d / 1e3) % 60) + '<small>s</small>';
  $('bdayDate').textContent = next.toLocaleDateString(undefined, { month:'long', day:'numeric', year:'numeric' });
}
setInterval(tick, 50); tick();

// Life in weeks
const wc = $('weeks'), wx = wc.getContext('2d'), COLS = 52, ROWS = LIFESPAN;
let pulse = 0;
function drawWeeks(){
  const w = wc.clientWidth || 600, cell = w / COLS, h = Math.ceil(cell * ROWS), dpr = devicePixelRatio || 1;
  wc.width = w * dpr; wc.height = h * dpr; wc.style.height = h + 'px';
  wx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const lived = Math.floor((Date.now() - BIRTH) / WEEK), gap = Math.max(1, cell * .22), sz = cell - gap;
  const cLived = css('--accent'), cEmpty = css('--cell');
  for (let i = 0; i < COLS * ROWS; i++){
    const x = (i % COLS) * cell, y = Math.floor(i / COLS) * cell;
    wx.globalAlpha = 1;
    wx.fillStyle = i < lived ? cLived : cEmpty;
    if (i < lived) wx.globalAlpha = .45 + .55 * (i / Math.max(1, lived));
    wx.beginPath(); wx.roundRect ? wx.roundRect(x, y, sz, sz, sz * .28) : wx.rect(x, y, sz, sz); wx.fill();
    if (i === lived){
      wx.globalAlpha = .35 + .65 * pulse; wx.fillStyle = css('--gold');
      wx.beginPath(); wx.arc(x + sz / 2, y + sz / 2, sz * (.7 + .3 * pulse), 0, 6.2832); wx.fill();
    }
  }
  wx.globalAlpha = 1;
  $('wk').textContent = lived.toLocaleString();
  $('lifePct').textContent = Math.min(100, (Date.now() - BIRTH) / YEAR / LIFESPAN * 100).toFixed(2) + '%';
}
let pdir = 1;
setInterval(() => { pulse += .12 * pdir; if (pulse >= 1 || pulse <= 0) pdir *= -1; drawWeeks(); }, 80);
addEventListener('resize', drawWeeks); drawWeeks(); window.weeksReady = true;

// Focus timer
const FOCUS_MS = 25 * 60 * 1000, LEN = 2 * Math.PI * 90, ring = $('ring');
ring.style.strokeDasharray = LEN;
let left = FOCUS_MS, endAt = 0, raf = 0, running = false;
function drawF(){
  const s = Math.ceil(left / 1000);
  $('ftime').textContent = left <= 0 ? 'Time’s Up!' : pad(Math.floor(s / 60)) + ':' + pad(s % 60);
  ring.style.strokeDashoffset = LEN * (1 - left / FOCUS_MS);
}
function frame(){
  left = Math.max(0, endAt - Date.now()); drawF();
  if (left <= 0){ running = false; $('focus').classList.add('done'); $('fStart').disabled = $('fPause').disabled = true; return; }
  raf = requestAnimationFrame(frame);
}
$('fStart').onclick = () => { if (running || left <= 0) return; running = true; endAt = Date.now() + left; $('fStart').disabled = true; $('fPause').disabled = false; raf = requestAnimationFrame(frame); };
$('fPause').onclick = () => { if (!running) return; running = false; cancelAnimationFrame(raf); left = Math.max(0, endAt - Date.now()); drawF(); $('fStart').disabled = false; $('fPause').disabled = true; };
$('fReset').onclick = () => { running = false; cancelAnimationFrame(raf); left = FOCUS_MS; $('focus').classList.remove('done'); drawF(); $('fStart').disabled = false; $('fPause').disabled = true; };
drawF();

// Habit streak
const dayKey = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
function streakNow(){
  const s = store.get('habit', { count: 0, last: '' }), y = new Date(); y.setDate(y.getDate() - 1);
  return (s.last === dayKey(new Date()) || s.last === dayKey(y)) ? s : { count: 0, last: s.last };
}
function renderHabit(){
  const s = streakNow(), done = s.last === dayKey(new Date());
  $('streak').textContent = s.count;
  $('logBtn').textContent = done ? 'Logged ✓' : 'Log today'; $('logBtn').disabled = done;
}
$('logBtn').onclick = () => { const s = streakNow(); if (s.last === dayKey(new Date())) return; store.set('habit', { count: s.count + 1, last: dayKey(new Date()) }); renderHabit(); };
renderHabit();

// Bucket list
let tasks = store.get('tasks', []);
function renderTasks(){
  const ul = $('list'); ul.innerHTML = '';
  $('cnt').textContent = tasks.length ? tasks.filter(t => t.done).length + ' / ' + tasks.length : '';
  if (!tasks.length){ const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'Nothing here yet. What do you want to do before it’s all said and done?'; ul.append(e); return; }
  tasks.forEach((t, i) => {
    const li = document.createElement('li'); if (t.done) li.className = 'done';
    const c = document.createElement('button'); c.className = 'chk'; c.textContent = '✓'; c.setAttribute('aria-label', 'Complete');
    c.onclick = () => { tasks[i].done = !tasks[i].done; store.set('tasks', tasks); renderTasks(); };
    const sp = document.createElement('span'); sp.textContent = t.text;
    const d = document.createElement('button'); d.className = 'del'; d.textContent = '✕'; d.setAttribute('aria-label', 'Delete');
    d.onclick = () => { tasks.splice(i, 1); store.set('tasks', tasks); renderTasks(); };
    li.append(c, sp, d); ul.append(li);
  });
}
function addTask(){ const v = $('taskIn').value.trim(); if (!v) return; tasks.push({ text: v, done: false }); store.set('tasks', tasks); $('taskIn').value = ''; renderTasks(); }
$('addBtn').onclick = addTask;
$('taskIn').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
renderTasks();

// Daily quote
const quotes = [
  '“The best way to predict the future is to create it.”',
  '“Stay hungry, stay foolish.”',
  '“Simplicity is the ultimate sophistication.”',
  '“Well done is better than well said.”',
  '“Make each day your masterpiece.”',
  '“Small steps every day add up to something extraordinary.”',
  '“The only way to do great work is to love what you do.”'
];
$('quote').textContent = quotes[Math.floor(Date.now() / 864e5) % quotes.length];
</script>
</body>
</html>
